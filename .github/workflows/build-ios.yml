name: Build iOS App (IPA)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Chọn phiên bản Xcode 16
        run: |
          XCODE_16_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | head -n 1)
          if [ -n "$XCODE_16_PATH" ]; then
            echo "Đang chuyển sang sử dụng: $XCODE_16_PATH"
            sudo xcode-select -s "$XCODE_16_PATH/Contents/Developer"
          else
            echo "Không tìm thấy thư mục Xcode_16 riêng biệt, tự động tìm bộ Xcode mới nhất hỗ trợ định dạng hiện tại..."
            sudo xcode-select -r
          fi
          xcodebuild -version

      - name: Biên dịch dự án bằng xcodebuild
        run: |
          xcodebuild clean build \
            -project Miumo.xcodeproj \
            -scheme Miumo \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Đóng gói thành file .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Lỗi: Không tìm thấy file .app sau khi biên dịch!"
            exit 1
          fi
          
          cp -R "$APP_PATH" Payload/
          zip -r Miumo.ipa Payload -x "*.DS_Store"

      - name: Tải file IPA lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Miumo-iOS-App
          path: Miumo.ipa
          retention-days: 7
