name: Build iOS App (IPA)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Biên dịch dự án bằng xcodebuild
        run: |
          xcodebuild clean build \
            -project Miumo.xcodeproj \
            -scheme Miumo \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Đóng gói thành file .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Lỗi: Không tìm thấy file .app sau khi biên dịch!"
            exit 1
          fi
          
          cp -R "$APP_PATH" Payload/
          zip -r Miumo.ipa Payload -x "*.DS_Store"

      - name: Tải file IPA lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Miumo-iOS-App
          path: Miumo.ipa
          retention-days: 7
