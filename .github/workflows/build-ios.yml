name: Build iOS App (IPA)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Kích hoạt Xcode 16
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Tìm thấy: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Biên dịch Swift thuần và Đóng gói IPA
        run: |
          # 1. Tạo cấu trúc thư mục ứng dụng iOS
          mkdir -p build/Payload/Miumo.app

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Sử dụng iPhoneOS SDK tại: $SDK_PATH"

          # 2. Biên dịch toàn bộ các file .swift trong thư mục src/
          echo "Đang biên dịch các file Swift trong thư mục src/..."
          swiftc src/*.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -O \
            -o build/Payload/Miumo.app/Miumo

          # 3. Tạo file Info.plist nếu chưa có trong src
          if [ -f "src/Info.plist" ]; then
            cp src/Info.plist build/Payload/Miumo.app/Info.plist
          else
            cat <<EOF > build/Payload/Miumo.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Miumo</string>
              <key>CFBundleIdentifier</key>
              <string>com.miumo.app</string>
              <key>CFBundleName</key>
              <string>Miumo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF
          fi

          # Sao chép file cấu hình Firebase nếu có
          if [ -f "src/GoogleService-Info.plist" ]; then
            cp src/GoogleService-Info.plist build/Payload/Miumo.app/
          fi

          # 4. Ký mã Ad-hoc để cài được qua TrollStore, AltStore, Sideloadly
          codesign --force --deep --sign - build/Payload/Miumo.app

          # 5. Đóng gói thành file .ipa
          cd build
          zip -r ../Miumo.ipa Payload -x "*.DS_Store"
          cd ..

      - name: Tải file IPA lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Miumo-iOS-App
          path: Miumo.ipa
          retention-days: 7
