name: Build iOS App (IPA)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Kích hoạt Xcode 16
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Tìm thấy: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Biên dịch iOS App
        run: |
          # 1. Tự động tìm file .xcodeproj trong kho lưu trữ
          PROJECT_FILE=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Lỗi: Không tìm thấy bất kỳ file .xcodeproj nào trong repository!"
            echo "Danh sách các file hiện tại:"
            ls -la
            exit 1
          fi

          echo "Đang sử dụng project: $PROJECT_FILE"

          # 2. Tự động lấy Scheme đầu tiên của project
          SCHEME=$(xcodebuild -project "$PROJECT_FILE" -list | awk '/Schemes:/{flag=1; next} flag && NF {print $1; exit}')
          if [ -z "$SCHEME" ]; then
            SCHEME="Miumo"
          fi
          echo "Đang sử dụng Scheme: $SCHEME"

          # 3. Chạy build
          xcodebuild clean build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Đóng gói file .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Lỗi: Không tìm thấy file .app sau khi build!"
            exit 1
          fi
          
          cp -R "$APP_PATH" Payload/
          zip -r Miumo.ipa Payload -x "*.DS_Store"

      - name: Tải file IPA lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Miumo-iOS-App
          path: Miumo.ipa
          retention-days: 7
