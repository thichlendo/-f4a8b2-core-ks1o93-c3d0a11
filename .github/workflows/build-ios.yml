name: Build iOS App (IPA)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Khởi tạo cấu trúc App Bundle
        run: |
          mkdir -p build/Payload/MyApp.app

      - name: Tạo file Info.plist chuẩn iOS
        run: |
          cat << 'EOF' > build/Payload/MyApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MyApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.miumo.app</string>
              <key>CFBundleName</key>
              <string>Miumo</string>
              <key>CFBundleDisplayName</key>
              <string>Miumo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Biên dịch Swift và đóng gói tài nguyên
        run: |
          swiftc src/*.swift \
            -o build/Payload/MyApp.app/MyApp \
            -target arm64-apple-ios16.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework SwiftUI \
            -framework UIKit \
            -O

          if [ -f "src/GoogleService-Info.plist" ]; then
            cp src/GoogleService-Info.plist build/Payload/MyApp.app/GoogleService-Info.plist
            echo "Đã sao chép GoogleService-Info.plist thành công."
          else
            echo "Cảnh báo: Không tìm thấy src/GoogleService-Info.plist."
          fi

          codesign -s - --force --deep build/Payload/MyApp.app

      - name: Nén thành file .ipa
        run: |
          cd build
          zip -r ../Miumo.ipa Payload -x "*.DS_Store"

      - name: Tải file IPA lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Miumo-iOS-App
          path: Miumo.ipa
          retention-days: 7
