name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project.yml
        run: |
          cat << 'EOF' > project.yml
          name: Miumo
          options:
            bundleIdPrefix: com.miumo
            deploymentTarget:
              iOS: "16.0"
          packages:
            Firebase:
              url: https://github.com/firebase/firebase-ios-sdk.git
              majorVersion: 11.0.0
          targets:
            Miumo:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: src
                  includes:
                    - "**/*.swift"
                    - "GoogleService-Info.plist"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.miumo.app
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Cho phép MioMo truy cập thư viện ảnh để đăng bài và cập nhật ảnh đại diện."
                  INFOPLIST_KEY_CFBundleDisplayName: "MioMo"
                  MARKETING_VERSION: "1.0.0"
                  CURRENT_PROJECT_VERSION: "1"
                  SWIFT_VERSION: "5.0"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
              dependencies:
                - package: Firebase
                  product: FirebaseCore
                - package: Firebase
                  product: FirebaseAuth
                - package: Firebase
                  product: FirebaseDatabase
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          xcodebuild clean build \
            -project Miumo.xcodeproj \
            -scheme Miumo \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Miumo.app Payload/
          zip -r Miumo-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miumo-iOS-IPA
          path: Miumo-iOS.ipa
