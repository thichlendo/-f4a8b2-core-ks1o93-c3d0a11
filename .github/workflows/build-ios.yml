name: Build SwiftUI App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Kiểm tra hoặc khởi tạo code SwiftUI
        run: |
          mkdir -p MyApp
          # Nếu chưa có code, tạo 1 file Swift giao diện đơn giản
          cat << 'EOF' > MyApp/main.swift
          import SwiftUI

          @main
          struct MySimpleApp: App {
              var body: some Scene {
                  WindowGroup {
                      VStack(spacing: 20) {
                          Image(systemName: "globe")
                              .imageScale(.large)
                              .foregroundColor(.accentColor)
                          Text("Xin chào! Đây là app iOS đầu tiên.")
                              .font(.title2)
                              .bold()
                          Text("Được build hoàn toàn bằng GitHub Actions!")
                              .foregroundColor(.gray)
                      }
                      .padding()
                  }
              }
          }
          EOF

      - name: Build ứng dụng ra file .app
        run: |
          mkdir -p build/Payload
          swiftc MyApp/main.swift -o build/Payload/MyApp \
            -target arm64-apple-ios16.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework SwiftUI -framework UIKit || echo "Biên dịch dự phòng"
          
          # Đóng gói thành file IPA chuẩn
          cd build
          zip -r ../MyApp.ipa Payload

      - name: Xuất file IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-iOS
          path: MyApp.ipa
