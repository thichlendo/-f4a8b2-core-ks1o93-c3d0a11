name: Build iOS App (IPA)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Kích hoạt Xcode 16
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Tìm thấy: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Tải thư viện Firebase và Biên dịch
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Dùng SDK: $SDK_PATH"
          
          # Cấp đầy đủ cờ SDK cho cả Clang (C/C++) và Swiftc để tránh nạp nhầm header của Mac
          swift build -c release \
            --triple arm64-apple-ios16.0 \
            -Xswiftc -sdk -Xswiftc "$SDK_PATH" \
            -Xcc -isysroot -Xcc "$SDK_PATH" \
            -Xcc -target -Xcc arm64-apple-ios16.0

      - name: Đóng gói thành file .ipa
        run: |
          mkdir -p Payload/Miumo.app

          # Copy file thực thi
          BINARY_PATH=$(find .build/arm64-apple-ios/release -maxdepth 1 -type f -perm +111 -name "Miumo" 2>/dev/null || find .build/arm64-apple-ios16.0/release -maxdepth 1 -type f -perm +111 -name "Miumo" | head -n 1)
          cp "$BINARY_PATH" Payload/Miumo.app/Miumo

          # Tạo Info.plist
          if [ -f "src/Info.plist" ]; then
            cp src/Info.plist Payload/Miumo.app/Info.plist
          else
            cat <<EOF > Payload/Miumo.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Miumo</string>
              <key>CFBundleIdentifier</key>
              <string>com.miumo.app</string>
              <key>CFBundleName</key>
              <string>Miumo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF
          fi

          # Copy cấu hình Firebase vào bundle
          if [ -f "src/GoogleService-Info.plist" ]; then
            cp src/GoogleService-Info.plist Payload/Miumo.app/
          fi

          # Ký mã ad-hoc
          codesign --force --deep --sign - Payload/Miumo.app

          # Đóng gói zip IPA
          zip -r Miumo.ipa Payload -x "*.DS_Store"

      - name: Tải file IPA lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Miumo-iOS-App
          path: Miumo.ipa
          retention-days: 7
