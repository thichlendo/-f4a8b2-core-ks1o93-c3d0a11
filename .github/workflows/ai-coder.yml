name: Auto Code with Gemini

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Nhập yêu cầu sửa/thêm tính năng cho dự án'
        required: true
        type: string

jobs:
  ai-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt Google GenAI SDK
        run: |
          pip install google-genai

      - name: AI đọc dự án và tự động sửa code
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import json
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY")
          user_prompt = os.environ.get("USER_PROMPT")

          client = genai.Client(api_key=api_key)

          # Đọc toàn bộ các file mã nguồn trong thư mục src/
          codebase = {}
          for file_path in glob.glob("src/**/*", recursive=True):
              if os.path.isfile(file_path) and not file_path.endswith(('.png', '.jpg', '.jpeg', '.ipk', '.ipa', '.zip')):
                  try:
                      with open(file_path, "r", encoding="utf-8") as f:
                          codebase[file_path] = f.read()
                  except Exception:
                      pass

          context = "Dưới đây là toàn bộ mã nguồn hiện tại của dự án trong thư mục src/:\n\n"
          for path, content in codebase.items():
              context += f"--- BẮT ĐẦU FILE: {path} ---\n{content}\n--- KẾT THÚC FILE ---\n\n"

          system_instruction = (
              "Bạn là kỹ sư phần mềm iOS cao cấp chuyên sâu về SwiftUI (iOS 16+ native). "
              "Nhiệm vụ của bạn là phân tích toàn diện mã nguồn hiện tại và yêu cầu của người dùng, "
              "sau đó tự động tạo mới hoặc sửa đổi các file cần thiết trong thư mục src/. "
              "YÊU CẦU BẮT BUỘC:\n"
              "1. Trả về kết quả duy nhất ở định dạng JSON hợp lệ (không kèm markdown bên ngoài).\n"
              "2. Viết mã nguồn hoàn chỉnh 100%, không cắt xén, không để lại chú thích // TODO hoặc // Code tiếp tục ở đây.\n"
              "Định dạng JSON:\n"
              "{\n"
              '  "files": [\n'
              '    {"path": "src/Views/LoginView.swift", "content": "Toàn bộ code mới..."}\n'
              '  ],\n'
              '  "commit_message": "Mô tả ngắn gọn nội dung cập nhật"\n'
              "}"
          )

          full_prompt = f"{context}\n\nYÊU CẦU CỦA NGƯỜI DÙNG:\n{user_prompt}"

          # Ưu tiên gọi model tối tân nhất gemini-4-argon, có fallback dự phòng
          target_models = ["gemini-4-argon", "gemini-2.5-pro", "gemini-1.5-pro"]
          response = None

          for model_name in target_models:
              try:
                  print(f"Đang gửi yêu cầu sang model: {model_name}...")
                  response = client.models.generate_content(
                      model=model_name,
                      contents=full_prompt,
                      config=types.GenerateContentConfig(
                          system_instruction=system_instruction,
                          response_mime_type="application/json",
                          temperature=0.2,
                      ),
                  )
                  print(f"-> Phản hồi thành công từ: {model_name}")
                  break
              except Exception as err:
                  print(f"Không thể kết nối {model_name}: {err}. Đang chuyển model tiếp theo...")

          if not response or not response.text:
              raise RuntimeError("Tất cả các model đều không phản hồi.")

          data = json.loads(response.text)

          for item in data.get("files", []):
              fpath = item["path"]
              os.makedirs(os.path.dirname(fpath), exist_ok=True)
              with open(fpath, "w", encoding="utf-8") as f:
                  f.write(item["content"])
              print(f"Đã cập nhật: {fpath}")

          with open("commit_msg.txt", "w", encoding="utf-8") as f:
              f.write(data.get("commit_message", f"AI update: {user_prompt}"))
          EOF

      - name: Tự động Commit & Push code mới
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          if git diff --staged --quiet; then
            echo "Không có thay đổi nào được tạo."
          else
            COMMIT_MSG=$(cat commit_msg.txt)
            git commit -m "$COMMIT_MSG"
            git push origin main
          fi
